name: SC-200 Transcripts

# 抓 EP1–EP10 官方影片字幕（開發環境連不上 YouTube，Actions runner 可以）。
# 手動觸發；抓到的檔案 commit 回觸發時的分支。

on:
  workflow_dispatch:
    inputs:
      force:
        description: '重抓全部（忽略已存在檔案）'
        type: boolean
        default: false
  push:
    branches: ['claude/**']
    paths:
      - 'sc200/scripts/fetch_transcripts.py'
      - '.github/workflows/sc200-transcripts.yml'

permissions:
  contents: write

concurrency:
  group: sc200-transcripts
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yt-dlp
        run: python -m pip install -U yt-dlp

      - name: Fetch transcripts
        run: python sc200/scripts/fetch_transcripts.py ${{ inputs.force == true && '--force' || '' }}

      - name: Commit transcripts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sc200/transcripts
          if git diff --cached --quiet; then
            echo "No transcript changes to commit."
          else
            git commit -m "chore(sc200): fetch video transcripts [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
