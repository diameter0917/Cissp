<div class="exam-box"><span class="exam-label">常見陷阱</span>
<strong>自動化規則 vs playbook</strong>：改事件屬性（指派、標籤、狀態、嚴重性）用自動化規則就夠；要跟外部系統互動（發 Teams 通知、開 ticket、封鎖 IP）才需要 playbook。題目常拿「哪個成本最低／管理負擔最小」來考這條線。
</div>
