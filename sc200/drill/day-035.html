<h2 data-toc="今日任務">弱項領域加強日</h2>
<p>資料驅動的補洞日：打開<strong>學習統計</strong>（下方按鈕），看「各領域正確率」與「最弱主題」清單，挑正確率最低的領域重練 40 題。</p>
<div class="point">
<strong>建議流程</strong>：統計頁確認最弱領域 → 點統計頁裡的「重練 40 題」連結（或手動到刷題首頁選該領域）→ 重練時放慢，每題把「為什麼其他三個錯」讀完 → 收尾清一輪錯題本。
</div>
<div class="exam-box"><span class="exam-label">主題級補洞</span>
「最弱主題」若集中在特定幾個（例如 dcr、asr-rules、kql-join），別只刷題——回對應電子報把該節<strong>重讀一遍再刷</strong>，效率比純刷題高一倍。下週三就是模擬考 2，這兩天的補洞直接反映在分數上。
</div>
