<h2 data-toc="今日任務">模擬考 2 檢討＋錯題殲滅</h2>
<p>雙任務：上午檢討模考 2（沿用錯因三分類：知識洞／審題失誤／二選一猶豫），下午進行<strong>錯題殲滅</strong>——錯題本重練到清空為止（每題連對 2 次出榜）。</p>
<div class="point">
<strong>殲滅戰打法</strong>：做一輪錯題本 → 還在榜上的題目回電子報讀對應章節 → 再做一輪 → 重複直到錯題本歸零或剩個位數。這是考前最高投報率的一天。
</div>
<div class="exam-box"><span class="exam-label">審題陷阱清單</span>
把兩次模考累積的「審題失誤」整理成自己的清單（例：看漏 <strong>least/first/minimize</strong>、把 automation rule 看成 analytics rule）。考前一天只需要重讀這張清單＋速記表。
</div>
